<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMRM Exam</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <div>
            <h1>FMRM Exam</h1>
            <p class="subtitle">Random 25 Questions</p>
        </div>

        <div class="timer-box">
            <span id="timer">30:00</span>
        </div>
    </header>

    <div id="progressBarContainer">
        <div id="progressBar"></div>
    </div>

    <div id="stats">
        <span id="answeredCount">0</span>
        /
        <span id="totalCount">25</span>
        Answered
    </div>

    <form id="examForm">
        <div id="questionContainer"></div>

        <div class="submit-section">
            <button
                type="button"
                id="submitButton"
            >
                Submit Exam
            </button>
        </div>
    </form>

    <div id="result"></div>

</div>

<script src="questions.js"></script>
<script src="app.js"></script>

</body>
</html>
