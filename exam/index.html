<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线考试系统</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>在线考试系统</h1>

<p>随机抽取25题</p>

<div id="quiz"></div>

<button onclick="submitExam()">提交试卷</button>

<div id="result"></div>

<script src="questions.js"></script>

<script>

let examQuestions = [];

function loadExam(){

    const saved =
        localStorage.getItem("examQuestions");

    if(saved){

        examQuestions =
            JSON.parse(saved);

    }else{

        examQuestions =
            [...questionBank]
            .sort(() => Math.random() - 0.5)
            .slice(0,25);

        localStorage.setItem(
            "examQuestions",
            JSON.stringify(examQuestions)
        );
    }

    renderQuestions();
}

function renderQuestions(){

    let html = "";

    examQuestions.forEach((q,index)=>{

        html += `
        <div class="question" id="q${index}">
            <h3>${index+1}. ${q.title}</h3>
        `;

        q.options.forEach((op,i)=>{

            html += `
            <label>
                <input
                    type="radio"
                    name="q${index}"
                    value="${i}">
                ${op}
            </label>
            <br>
            `;
        });

        html += `</div>`;
    });

    document.getElementById("quiz").innerHTML =
        html;
}

function submitExam(){

    let score = 0;

    examQuestions.forEach((q,index)=>{

        const checked =
            document.querySelector(
                `input[name="q${index}"]:checked`
            );

        const box =
            document.getElementById(`q${index}`);

        if(
            checked &&
            Number(checked.value) === q.answer
        ){
            score++;
            box.classList.add("correct");
        }else{
            box.classList.add("wrong");
        }
    });

    document.getElementById("result")
        .innerHTML =
        `成绩：${score}/${examQuestions.length}`;

    localStorage.removeItem("examQuestions");
}

loadExam();

</script>

</body>
</html>
