    <style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #f4f6f9; font-family: Arial, Helvetica, sans-serif; color: #222; }
.container { max-width: 1100px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.header h1 { margin: 0; }
.subtitle { margin: 6px 0 0; color: #666; }
.timer-box { background: #111827; color: white; padding: 12px 20px; border-radius: 10px; font-size: 20px; font-weight: bold; transition: background 0.5s ease; }
#progressBarContainer { width: 100%; height: 12px; background: #d1d5db; border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
#progressBar { width: 0%; height: 100%; background: #2563eb; transition: width 0.3s ease; }
#stats { margin-bottom: 20px; font-weight: bold; }
.question { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 2px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.question h3 { margin-top: 0; line-height: 1.5; }
.multi-hint { display: inline-block; margin-bottom: 10px; padding: 3px 10px; border-radius: 999px; background: #eff6ff; color: #2563eb; font-size: 13px; font-weight: bold; border: 1px solid #bfdbfe; }
.option { display: block; margin: 10px 0; padding: 10px; border-radius: 8px; cursor: pointer; }
.option:hover { background: #f3f4f6; }
.option input { margin-right: 10px; }
.correct { border-color: #16a34a; }
.incorrect { border-color: #dc2626; }
.answer-box { margin-top: 14px; padding: 14px; border-radius: 8px; background: #fef9f9; font-size: 14px; line-height: 1.7; border: 1px solid #fecaca; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer-box > div { padding: 8px 10px; border-radius: 6px; }
.answer-box > div:first-child { background: #f0fdf4; border: 1px solid #bbf7d0; }
.answer-box > div:last-child { background: #fff5f5; border: 1px solid #fecaca; }
.submit-section { text-align: center; margin-top: 30px; }
#submitButton { border: none; background: #2563eb; color: white; padding: 14px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
#submitButton:hover:not(:disabled) { background: #1d4ed8; }
#submitButton:disabled { cursor: default; background: #6b7280; }
#result { margin-top: 30px; }
.score-card { background: white; padding: 30px 20px; border-radius: 12px; font-size: 24px; font-weight: bold; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.pass { color: #16a34a; font-size: 36px; }
.fail { color: #dc2626; font-size: 36px; }

  body { padding: 12px; }

  .timer-box { width: 100%; text-align: center; }

  #submitButton { width: 100%; }
  .answer-box { grid-template-columns: 1fr; }
}
    </style>

<script>
const EXAM_DURATION = 30 * 60;
let examQuestions = [];
let remainingSeconds = EXAM_DURATION;
let timerInterval = null;
let submitted = false;

function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function initializeExam() {
    examQuestions = shuffle(questionBank).slice(0, 25);
    document.getElementById("totalCount").textContent = examQuestions.length;
    renderQuestions();
    startTimer();
    updateProgress();
    document.getElementById("submitButton").addEventListener("click", submitExam);
}

function renderQuestions() {
    const container = document.getElementById("questionContainer");
    let html = "";
    examQuestions.forEach((question, index) => {
        const inputType = question.type === "multiple" ? "checkbox" : "radio";
        const multiHint = question.type === "multiple"
            ? '<span class="multi-hint">Select all that apply</span>'
            : "";
        html += `<div class="question" id="question-${index}"><h3>${index + 1}. ${question.question}</h3>${multiHint}`;
        question.options.forEach((option, optionIndex) => {
            const letter = String.fromCharCode(65 + optionIndex);
            html += `<label class="option"><input type="${inputType}" name="q${index}" value="${letter}"> ${letter}. ${option}</label>`;
        });
        html += `</div>`;
    });
    container.innerHTML = html;
    document.querySelectorAll("input").forEach(input => {
        input.addEventListener("change", updateProgress);
    });
}

function updateProgress() {
    let answered = 0;
    examQuestions.forEach((question, index) => {
        const checked = document.querySelectorAll(`input[name="q${index}"]:checked`);
        if (checked.length > 0) answered++;
    });
    document.getElementById("answeredCount").textContent = answered;
    document.getElementById("progressBar").style.width = `${(answered / examQuestions.length) * 100}%`;
}

function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        remainingSeconds--;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            submitExam();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;
    document.getElementById("timer").textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
    if (remainingSeconds <= 300) {
        document.querySelector(".timer-box").style.background = "#b91c1c";
    }
}

function getUserAnswers(index) {
    return Array.from(document.querySelectorAll(`input[name="q${index}"]:checked`)).map(el => el.value);
}

function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    const s1 = [...a].sort(), s2 = [...b].sort();
    return s1.every((v, i) => v === s2[i]);
}

function letterToText(question, letter) {
    const index = letter.charCodeAt(0) - 65;
    return `${letter}. ${question.options[index] || "?"}`;
}

function submitExam() {
    if (submitted) return;
    submitted = true;
    clearInterval(timerInterval);

    const submitBtn = document.getElementById("submitButton");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitted";

    let score = 0;
    examQuestions.forEach((question, index) => {
        const userAnswer = getUserAnswers(index);
        const correctAnswer = question.answer;
        const box = document.getElementById(`question-${index}`);
        box.querySelectorAll("input").forEach(inp => inp.disabled = true);
        const correct = arraysEqual(userAnswer, correctAnswer);
        if (correct) {
            score++;
            box.classList.add("correct");
        } else {
            box.classList.add("incorrect");
            const review = document.createElement("div");
            review.className = "answer-box";
            const correctText = correctAnswer.map(l => letterToText(question, l)).join("<br>");
            const yourText = userAnswer.length > 0
                ? userAnswer.map(l => letterToText(question, l)).join("<br>")
                : "<em>No answer</em>";
            review.innerHTML = `<div><strong>✓ Correct answer:</strong><br>${correctText}</div><div><strong>✗ Your answer:</strong><br>${yourText}</div>`;
            box.appendChild(review);
        }
    });

    const percentage = (score / examQuestions.length) * 100;
    document.getElementById("result").innerHTML = `
        <div class="score-card">
            Score: ${score} / ${examQuestions.length}<br><br>
            <span class="${percentage >= 60 ? "pass" : "fail"}">${percentage.toFixed(1)}%</span><br><br>
            <span style="font-size:16px;color:#666;font-weight:normal">
                ${percentage >= 60 ? "🎉 Passed!" : "📚 Not passed. Review the answers above."}
            </span>
        </div>`;
    document.getElementById("result").scrollIntoView({ behavior: "smooth" });
}

initializeExam();
</script>
